{
  "name": "History2 linear control",
  "on": {
    "push": {
      "branches": [
        "hist-linear"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "marker": {
      "name": "History2 linear control",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "run": "echo HISTORY2_COMPLETE case=linear variant=control event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA ref=$GITHUB_REF"
        }
      ]
    }
  }
}
