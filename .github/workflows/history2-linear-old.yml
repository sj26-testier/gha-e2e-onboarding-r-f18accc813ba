{
  "name": "History2 linear old",
  "on": {
    "push": {
      "branches": [
        "hist-linear"
      ],
      "paths": [
        "old.txt"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "marker": {
      "name": "History2 linear old",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "run": "echo HISTORY2_COMPLETE case=linear variant=old event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA ref=$GITHUB_REF"
        }
      ]
    }
  }
}
